<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0284c7" />
      <stop offset="50%" stop-color="#0369a1" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>
    <linearGradient id="tiffinGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#0284c7" />
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24" />
      <stop offset="100%" stop-color="#f59e0b" />
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#000000" flood-opacity="0.45" />
    </filter>
  </defs>

  <!-- App Rounded Background -->
  <rect width="512" height="512" rx="128" fill="url(#bgGrad)" />

  <!-- Outer Glow / Ring -->
  <rect x="16" y="16" width="480" height="480" rx="112" fill="none" stroke="rgba(255,255,255,0.12)" stroke-width="4" />

  <!-- Tiffin Box Handle -->
  <g filter="url(#shadow)">
    <path d="M 200 130 C 200 95, 312 95, 312 130" fill="none" stroke="#e0f2fe" stroke-width="16" stroke-linecap="round" />
    <!-- Tiffin Tier 1 (Top) -->
    <rect x="156" y="140" width="200" height="60" rx="16" fill="#f8fafc" />
    <rect x="160" y="144" width="192" height="12" rx="6" fill="#e2e8f0" />
    
    <!-- Tiffin Tier 2 (Middle) -->
    <rect x="146" y="210" width="220" height="68" rx="16" fill="url(#tiffinGrad)" />
    <rect x="150" y="214" width="212" height="12" rx="6" fill="#bae6fd" opacity="0.6" />

    <!-- Tiffin Tier 3 (Bottom) -->
    <rect x="136" y="288" width="240" height="78" rx="18" fill="#0369a1" />
    <rect x="140" y="292" width="232" height="14" rx="7" fill="#7dd3fc" opacity="0.4" />

    <!-- Vertical Brass Locking Latches -->
    <rect x="124" y="170" width="12" height="190" rx="6" fill="url(#goldGrad)" />
    <circle cx="130" cy="165" r="8" fill="url(#goldGrad)" />
    <rect x="376" y="170" width="12" height="190" rx="6" fill="url(#goldGrad)" />
    <circle cx="382" cy="165" r="8" fill="url(#goldGrad)" />

    <!-- Indian Rupee Badge Floating -->
    <g transform="translate(305, 290)">
      <circle cx="55" cy="55" r="55" fill="url(#goldGrad)" />
      <circle cx="55" cy="55" r="50" fill="none" stroke="#fff" stroke-width="3" opacity="0.5" />
      <text x="55" y="73" font-family="system-ui, -apple-system, sans-serif" font-size="58" font-weight="900" fill="#78350f" text-anchor="middle">₹</text>
    </g>
  </g>
</svg>
