<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a181e" />
      <stop offset="50%" stop-color="#061217" />
      <stop offset="100%" stop-color="#05080c" />
    </linearGradient>
    <linearGradient id="tiffinGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00f5a0" />
      <stop offset="100%" stop-color="#00d26a" />
    </linearGradient>
    <linearGradient id="cyanGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00d4ff" />
      <stop offset="100%" stop-color="#0284c7" />
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffe066" />
      <stop offset="100%" stop-color="#ffb800" />
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="16" stdDeviation="20" flood-color="#000000" flood-opacity="0.65" />
    </filter>
  </defs>

  <!-- App Rounded Background -->
  <rect width="512" height="512" rx="128" fill="url(#bgGrad)" />

  <!-- Outer Glow / Specular Ring -->
  <rect x="16" y="16" width="480" height="480" rx="112" fill="none" stroke="rgba(0, 245, 160, 0.28)" stroke-width="3" />
  <rect x="22" y="22" width="468" height="468" rx="106" fill="none" stroke="rgba(255, 255, 255, 0.08)" stroke-width="1.5" />

  <!-- Tiffin Box Container -->
  <g filter="url(#shadow)">
    <!-- Tiffin Box Handle -->
    <path d="M 200 128 C 200 90, 312 90, 312 128" fill="none" stroke="#dcfce7" stroke-width="16" stroke-linecap="round" />
    
    <!-- Tiffin Tier 1 (Top) -->
    <rect x="156" y="138" width="200" height="62" rx="16" fill="#f0fdf4" />
    <rect x="160" y="142" width="192" height="12" rx="6" fill="#bbf7d0" opacity="0.7" />
    
    <!-- Tiffin Tier 2 (Middle - Electric Mint) -->
    <rect x="146" y="208" width="220" height="70" rx="16" fill="url(#tiffinGrad)" />
    <rect x="150" y="212" width="212" height="12" rx="6" fill="#ffffff" opacity="0.35" />

    <!-- Tiffin Tier 3 (Bottom - Glacial Cyan/Teal) -->
    <rect x="136" y="286" width="240" height="80" rx="18" fill="url(#cyanGrad)" />
    <rect x="140" y="290" width="232" height="14" rx="7" fill="#ffffff" opacity="0.3" />

    <!-- Vertical Brass Locking Latches -->
    <rect x="124" y="168" width="12" height="194" rx="6" fill="url(#goldGrad)" />
    <circle cx="130" cy="163" r="8" fill="url(#goldGrad)" />
    <rect x="376" y="168" width="12" height="194" rx="6" fill="url(#goldGrad)" />
    <circle cx="382" cy="163" r="8" fill="url(#goldGrad)" />

    <!-- Indian Rupee Badge Floating -->
    <g transform="translate(305, 288)">
      <circle cx="55" cy="55" r="55" fill="url(#goldGrad)" />
      <circle cx="55" cy="55" r="49" fill="none" stroke="#ffffff" stroke-width="2.5" opacity="0.6" />
      <text x="55" y="74" font-family="'Outfit', system-ui, -apple-system, sans-serif" font-size="58" font-weight="900" fill="#451a03" text-anchor="middle">₹</text>
    </g>
  </g>
</svg>
